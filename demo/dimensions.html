<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>比比 · 维度选择（演示）</title>
<link rel="stylesheet" href="assets/style.css">
<style>
.dm-top{display:flex;align-items:center;gap:10px;padding:12px 14px;position:sticky;top:0;background:var(--canvas);z-index:50;border-bottom:1px solid var(--line)}
.dm-top .back{font-size:20px;cursor:pointer;color:var(--ink)}
.dm-top .t{font-size:17px;font-weight:700;color:var(--ink)}
.dm-top .t em{font-style:normal;color:var(--red)}
.sum{display:flex;align-items:center;gap:8px;margin:14px 12px;background:var(--surface);border-radius:14px;padding:12px 14px}
.sum-thumb{width:56px;height:56px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 1px 5px rgba(0,0,0,.08)}
.sum-info{flex:1;min-width:0}
.sum-name{font-size:13px;font-weight:600;color:var(--ink)}
.sum-price{font-size:13px;color:var(--red);font-weight:700;margin-top:2px}
.sum-edit{font-size:11px;color:var(--link);cursor:pointer;flex-shrink:0;padding:4px 2px}
.group{padding:0 12px}
.group h4{font-size:14px;color:var(--ink);margin:14px 0 10px;display:flex;align-items:center;gap:6px}
.group h4 span{font-size:10px;color:var(--sub);font-weight:400;background:var(--surface);padding:2px 7px;border-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.dim-note{margin:16px 12px 0;font-size:11px;color:var(--sub);line-height:1.6;background:var(--surface2);border-radius:10px;padding:10px 12px}
.dm-bottom{position:fixed;bottom:0;width:390px;background:var(--canvas);padding:12px 16px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(0,0,0,.06);z-index:70}
.dm-go{width:100%;background:var(--red);color:#fff;font-size:14px;font-weight:700;text-align:center;padding:13px 0;border-radius:24px;border:none;transition:transform .12s}
.dm-go:active{transform:scale(.98)}
.loading-mask{position:fixed;inset:0;background:rgba(255,255,255,.96);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.spinner{width:38px;height:38px;border:3.5px solid #ffe0e6;border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-t{font-size:14px;color:var(--txt)}
.load-s{font-size:11px;color:var(--sub)}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>6:14</span><span class="sb-r"><span class="sig"><i></i><i></i><i></i><i></i></span><span class="wifi"></span><span class="batt"></span></span></div>

  <div class="dm-top">
    <span class="back" onclick="history.back()">‹</span>
    <span class="t"><em>比比</em> · 选要比的维度</span>
  </div>

  <div class="sum" id="sum"></div>

  <div class="group">
    <h4>客观参数 <span>商品页直读，不经过AI</span></h4>
    <div class="chips" id="chips-obj"></div>
  </div>
  <div class="group">
    <h4>实测主观 <span>AI翻笔记取证据，热门已预勾</span></h4>
    <div class="chips" id="chips-sub"></div>
  </div>

  <div class="dim-note">· 只陈列笔记证据，不打分不推荐，裁决权在你<br>· 证据不足3条的结论会标注「样本不足」<br>· 比完随时回报告页底部「＋」再加维度</div>

  <div class="dm-bottom"><button class="dm-go" onclick="go()">开始对比</button></div>

  <div class="loading-mask" id="loading">
    <div class="spinner"></div>
    <div class="load-t">正在翻 12 篇笔记…</div>
    <div class="load-s">逐维度抽取证据中，先出的维度先展示</div>
  </div>
</div>

<script src="assets/demo.js"></script>
<script src="src/data/knowledge-table.js"></script>
<script src="src/data/notes-tent.js"></script>
<script src="src/data/notes-suit.js"></script>
<script>
let skus=load('bb_skus',SKU_ORDER); if(skus.length<2) skus=[...SKU_ORDER];
// 类目边界（F46）：只陈列该组SKU所属类目的维度
const KT=BibiKnowledgeTable.TABLE.filter(d=>d.category===SKUS[skus[0]].category);
const OBJ=KT.filter(d=>d.layer==='objective');
const SUB=KT.filter(d=>d.layer==='subjective');
const picked={};
KT.forEach(d=>picked[d.name]=d.hot_rank<=4);
const noteCount=BibiNotes.NOTES.filter(n=>skus.includes(n.sku_id)).length;

document.getElementById('sum').innerHTML = skus.map(id=>{
  const s=SKUS[id];
  return `<div style="display:flex;align-items:center;gap:8px;flex:1;min-width:0">
    ${skuThumbHtml(s,'sum-thumb')}
    <div class="sum-info"><div class="sum-name">${s.short}</div><div class="sum-price">¥${s.price}</div></div>
  </div>`;
}).join('') + `<span class="sum-edit" onclick="location.href='search.html'">换商品</span>`;
document.querySelector('.load-t').textContent=`正在翻 ${noteCount} 篇笔记…`;

function renderChips(){
  document.getElementById('chips-obj').innerHTML=OBJ.map(d=>`<span class="chip ${picked[d.name]?'on':''}" onclick="tg('${d.name}')">${d.name}${picked[d.name]?' ✓':''}</span>`).join('');
  document.getElementById('chips-sub').innerHTML=SUB.map(d=>`<span class="chip ${picked[d.name]?'on':''}" onclick="tg('${d.name}')">${d.name}${picked[d.name]?' ✓':''}</span>`).join('');
}
function tg(n){ picked[n]=!picked[n]; renderChips(); }
function go(){
  const dims=KT.map(d=>d.name).filter(n=>picked[n]);
  if(dims.length===0){ toast('选一个想比的维度吧'); return; }
  document.getElementById('loading').style.display='flex';
  store('bb_dims',dims);
  setTimeout(()=>location.href='report.html',1400);
}
renderChips();
</script>
</body>
</html>
